:root{
  --bg:#EFEAE2; --text:#111B21; --muted:#54656F; --green:#25D366; --teal:#008069;
  --own:#D9FDD3; --in:#FFFFFF; --card:#FFFFFF; --line:rgba(17,27,33,.10);
  --chatbg:#EFEAE2; --head:#008069; --headtext:#fff; --chip:#FFFFFF; --chiptext:#008069;
  --frame:#111B21; --shadow:0 30px 80px -30px rgba(17,27,33,.45);
  --sys:#FFF3C4; --systext:#54656F; --log:#FFFFFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B141A; --text:#E9EDEF; --muted:#8696A0; --own:#005C4B; --in:#202C33; --card:#202C33;
  --line:rgba(233,237,239,.10); --chatbg:#0B141A; --head:#202C33; --headtext:#E9EDEF;
  --chip:#202C33; --chiptext:#25D366; --frame:#000; --sys:#182229; --systext:#8696A0; --log:#111B21;
  --shadow:0 30px 80px -30px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#0B141A; --text:#E9EDEF; --muted:#8696A0; --own:#005C4B; --in:#202C33; --card:#202C33;
  --line:rgba(233,237,239,.10); --chatbg:#0B141A; --head:#202C33; --headtext:#E9EDEF;
  --chip:#202C33; --chiptext:#25D366; --frame:#000; --sys:#182229; --systext:#8696A0; --log:#111B21;
  --shadow:0 30px 80px -30px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{max-width:1080px;margin:0 auto;padding:18px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.toggle button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:7px 12px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--teal);color:#fff}
.intro{grid-area:intro;padding:4px 0 0}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--teal);background:color-mix(in srgb,var(--green) 16%,transparent);padding:5px 10px;border-radius:999px}
:root[data-theme="dark"] .kicker{color:var(--green)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kicker{color:var(--green)}}
h1{font-size:clamp(28px,5vw,44px);line-height:1.05;letter-spacing:-.025em;margin:12px 0 8px;font-weight:850}
.intro p{margin:0;color:var(--muted);max-width:620px}
.stage{max-width:1080px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);grid-template-areas:"phone intro" "phone side";grid-template-rows:auto 1fr;column-gap:36px;row-gap:20px;align-items:start}
.phone{grid-area:phone}.side{grid-area:side}
@media (max-width:820px){
  .stage{grid-template-columns:1fr;grid-template-areas:"intro" "phone" "side";padding-top:10px}
  h1{font-size:27px;margin:8px 0 6px}
  .intro p{font-size:14.5px}
}

/* phone */
.phone{background:var(--frame);border-radius:46px;padding:10px;box-shadow:var(--shadow);width:100%;max-width:400px;margin:0 auto;position:relative}
.screen{border-radius:37px;overflow:hidden;background:var(--chatbg);height:min(680px,calc(100svh - 110px));min-height:520px;display:flex;flex-direction:column;position:relative}
.status{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;background:var(--head);color:var(--headtext)}
.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:24px;background:#000;border-radius:20px;z-index:3}
.status .icons{display:flex;gap:5px;align-items:center}
.status svg{width:16px;height:16px}
.chathead{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 10px;background:var(--head);color:var(--headtext)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FFB547,#FF5E7E);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.who{min-width:0;flex:1}
.who b{display:block;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12.5px;opacity:.85}
.badge-demo{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:3px 7px;border-radius:6px}
.msgs{flex:1;overflow-y:auto;padding:12px 10px 8px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth;
  background-image:radial-gradient(color-mix(in srgb,var(--text) 5%,transparent) 1px,transparent 1px);background-size:18px 18px}
.day{align-self:center;font-size:12px;font-weight:600;background:var(--sys);color:var(--systext);padding:5px 10px;border-radius:8px;margin:8px 0;box-shadow:0 1px .5px rgba(0,0,0,.08)}
.b{max-width:84%;padding:7px 9px 6px;border-radius:10px;font-size:14.5px;line-height:1.4;box-shadow:0 1px .5px rgba(0,0,0,.13);position:relative;animation:pop .22s ease-out both;white-space:pre-line;overflow-wrap:anywhere}
.b.in{align-self:flex-start;background:var(--in);border-top-left-radius:2px}
.b.out{align-self:flex-end;background:var(--own);border-top-right-radius:2px}
.b .meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.b .meta svg{width:16px;height:11px}
.b + .b.in:not(.first),.b + .b.out:not(.first){margin-top:0}
.b.first{margin-top:6px}
.fast{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--teal);background:color-mix(in srgb,var(--green) 18%,var(--in));padding:3px 8px;border-radius:999px;margin:2px 0 4px;animation:pop .25s ease-out both}
:root[data-theme="dark"] .fast{color:var(--green)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fast{color:var(--green)}}
.fast svg{width:12px;height:12px}
.q{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:13.5px;font-variant-numeric:tabular-nums}
.q td{padding:3px 0;vertical-align:top}
.q td:last-child{text-align:right;padding-left:10px;white-space:nowrap}
.q tr.sub td{color:var(--muted);font-size:12.5px}
.q tr.total td{border-top:1px solid var(--line);padding-top:6px;font-weight:800;font-size:15px}
.menu{margin:6px 0 2px;display:grid;gap:5px}
.menu div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.menu b{font-variant-numeric:tabular-nums;white-space:nowrap}
.paylink{display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px;border-radius:8px;background:color-mix(in srgb,var(--text) 6%,transparent);text-decoration:none;font-size:13px}
.paylink b{display:block;color:var(--teal)}
:root[data-theme="dark"] .paylink b{color:var(--green)}

@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

.chip:active{transform:scale(.97)}
.chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.composer{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px 14px}
.composer .fake{flex:1;background:var(--in);color:var(--muted);border-radius:999px;padding:10px 14px;font-size:14px;box-shadow:0 1px .5px rgba(0,0,0,.1)}
.composer .send{width:42px;height:42px;border-radius:50%;background:var(--teal);display:grid;place-items:center;color:#fff;flex:none}
.composer .send svg{width:20px;height:20px}

.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.panel .sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-height:120px}
.log li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px;animation:pop .25s ease-out both}
.log .dot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--teal)}
:root[data-theme="dark"] .log .dot{color:var(--green)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .log .dot{color:var(--green)}}
.log .dot svg{width:16px;height:16px}
.log small{display:block;color:var(--muted);font-size:12px}
.log .empty{color:var(--muted);font-size:14px;display:block}
.notify{display:none;border-radius:16px;padding:14px;background:#111B21;color:#E9EDEF;box-shadow:var(--shadow);animation:pop .3s ease-out both}
.notify.on{display:block}
.notify .nh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#8696A0;margin-bottom:6px}
.notify .nh svg{width:16px;height:16px;color:#25D366}
.notify b{display:block;font-size:15px;margin-bottom:2px}
.notify p{margin:0;font-size:14px;color:#D1D7DB;white-space:pre-line}
.cta{display:none;background:var(--teal);color:#fff;border-radius:18px;padding:18px}
.cta.on{display:block;animation:pop .3s ease-out both}
.cta h2{margin:0 0 6px;font-size:19px;letter-spacing:-.01em}
.cta p{margin:0 0 12px;font-size:14.5px;opacity:.92}
.cta .row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:11px 16px;font:inherit;font-weight:800;font-size:14.5px;cursor:pointer;text-decoration:none}
.btn.light{background:#fff;color:#008069}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.btn.plain{background:none;border:1px solid var(--line);color:var(--text)}
.fine{color:var(--muted);font-size:12.5px;margin:0}
.restart{align-self:flex-start}
.cta.on ~ .restart{display:none}
@media (max-width:820px){.screen{height:max(420px,calc(100svh - 330px));min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

/* ---------- Estado ---------- */
var lang = "es", ind = "party", st, timers = [], run = 0;
var $ = function(id){return document.getElementById(id);};
var msgs = $("msgs"), replies = $("replies"), log = $("log");
var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

function I(){ return IND[ind]; }
function t(k){ var v = I()[lang][k]; return v !== undefined ? v : T[lang][k]; }
function val(x){ return typeof x === "function" ? x() : x; }
function money(n){ return "$" + (Math.round(n*100)/100).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}).replace(/\.00$/,""); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function nextSaturday(){
  var d = new Date(); var add = (6 - d.getDay() + 7) % 7; if (add === 0) add = 7;
  d.setDate(d.getDate() + add); return d;
}
function satLabel(){
  var d = nextSaturday();
  var s = d.toLocaleDateString(lang === "es" ? "es-US" : "en-US", lang === "es" ? {day:"numeric", month:"long"} : {month:"long", day:"numeric"});
  return T[lang].saturday(s);
}
function clockStr(d){
  return d.toLocaleTimeString(lang === "es" ? "es-US" : "en-US", {hour:"numeric", minute:"2-digit"});
}
function now(){ return new Date(st.base.getTime() + st.offset); }

function later(fn, ms){ var my = run; timers.push(setTimeout(function(){ if (my === run) fn(); }, ms)); }
function scroll(){ msgs.scrollTop = msgs.scrollHeight; }

/* ---------- Pintar ---------- */
function bubble(side, html){
  var prev = msgs.lastElementChild;
  var el = document.createElement("div");
  el.className = "b " + side + ((!prev || !prev.classList.contains(side)) ? " first" : "");
  el.innerHTML = html + '<span class="meta">' + clockStr(now()) + (side === "out" ? '<svg aria-hidden="true"><use href="#i-check2"/></svg>' : "") + "</span>";
  msgs.appendChild(el); scroll(); return el;
}
function sys(text){ var el = document.createElement("div"); el.className = "day"; el.textContent = text; msgs.appendChild(el); scroll(); }
function fast(sec){ var el = document.createElement("div"); el.className = "fast"; el.innerHTML = '<svg aria-hidden="true"><use href="#i-bolt"/></svg>' + esc(t("fast")(sec)); msgs.appendChild(el); scroll(); }
function addLog(icon, title, sub){
  var e = log.querySelector(".emptyrow"); if (e) e.remove();
  var li = document.createElement("li");
  li.innerHTML = '<span class="dot"><svg aria-hidden="true"><use href="#i-' + icon + '"/></svg></span><span><b>' + esc(title) + "</b><small>" + clockStr(now()) + " · " + esc(sub) + "</small></span>";
  log.appendChild(li);
}
function setReplies(list){
  replies.innerHTML = "";
  list.forEach(function(r, i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = r.label; b.style.animationDelay = (i * 40) + "ms";
    b.addEventListener("click", function(){ replies.innerHTML = ""; r.go(); });
    replies.appendChild(b);
  });
}

/* El cliente escribe; el negocio contesta con "escribiendo…" */
function say(text){ st.offset += 4000; bubble("out", esc(text)); }
/* Tiempos reales de WhatsApp Cloud API + Make (webhook instantáneo):
   ~1.5 s hasta que Make recibe el mensaje y marca "escribiendo",
   respuesta total entre REPLY_MIN y REPLY_MAX s, mensajes seguidos ~1 s aparte. */
var REPLY_MIN = 5, REPLY_MAX = 9, RECEIVE_MS = 1500, GAP_MS = 1000;
function botTurn(parts, done, opts){
  opts = opts || {};
  var started = Date.now();
  var total = (REPLY_MIN + Math.random() * (REPLY_MAX - REPLY_MIN)) * 1000;
  var pres = $("presence");
  later(function(){
    pres.textContent = t("typing");
    var ty = document.createElement("div"); ty.className = "typing"; ty.innerHTML = "<i></i><i></i><i></i>"; msgs.appendChild(ty); scroll();
    later(function(){
      var secs = Math.max(1, Math.round((Date.now() - started) / 1000));
      st.offset += secs * 1000;
      ty.remove();
      bubble("in", parts[0]);
      if (opts.fast) fast(secs);
      var i = 1;
      (function next(){
        if (i >= parts.length){ pres.textContent = t("online"); if (done) done(secs); return; }
        msgs.appendChild(ty); scroll();
        later(function(){ ty.remove(); bubble("in", parts[i]).classList.remove("first"); i++; next(); }, GAP_MS);
      })();
    }, total - RECEIVE_MS);
  }, RECEIVE_MS);
}

/* ---------- Flujo ---------- */
function start(){
  run++; timers.forEach(clearTimeout); timers = [];
  st = {base:new Date(), offset:0, item:null, extra:null, opt:null, when:val(I().when), total:0, name:null};
  msgs.innerHTML = ""; log.innerHTML = '<li class="emptyrow"><span class="empty">' + esc(t("logEmpty")) + "</span></li>";
  $("notify").classList.remove("on"); $("cta").classList.remove("on");
  $("presence").textContent = t("online");
  sys(t("today"));
  sys(t("hint"));
  setReplies([{label:t("c_start"), go:step1}]);
}

function step1(){
  var items = I().items;
  say(t("c_start"));
  addLog("chat", t("l_new"), t("l_newS"));
  var menu = '<div class="menu">' + Object.keys(items).map(function(k){
    return "<div><span>" + esc(items[k][lang]) + "</span><b>" + money(items[k].price) + "</b></div>";
  }).join("") + "</div>";
  botTurn([esc(t("b_menu1")(st.when)) + menu, esc(t("b_menu2"))], function(secs){
    addLog("bolt", t("l_reply")(secs), t("l_replyS"));
    setReplies(Object.keys(items).map(function(k){
      return {label:items[k][lang] + " · " + money(items[k].price), go:function(){ pickItem(k); }};
    }));
  }, {fast:true});
}

function pickItem(k){
  var it = I().items[k], extras = I().extras;
  st.item = k; say(it[lang]);
  addLog("tag", t("l_item")(it[lang]), t("l_itemS"));
  botTurn([esc(t("b_extras"))], function(){
    var opts = Object.keys(extras).map(function(x){
      return {label:"+ " + extras[x][lang] + " · " + money(extras[x].price), go:function(){ pickExtra(x); }};
    });
    opts.push({label:t("c_none"), go:function(){ pickExtra(null); }});
    setReplies(opts);
  });
}

function pickExtra(x){
  var opts = I().opts;
  st.extra = x; say(x ? "+ " + I().extras[x][lang] : t("c_none"));
  botTurn([esc(t("b_zip"))], function(){
    setReplies(Object.keys(opts).map(function(z){
      var o = opts[z], name = val(o[lang]);
      return {label:o.say ? o.say + " (" + name + ")" : name, go:function(){ pickOpt(z); }};
    }));
  });
}

function pickOpt(z){
  var ind0 = I(), o = ind0.opts[z], name = val(o[lang]);
  st.opt = z; say(o.say || name);
  if (ind0.whenOpt) st.when = name;
  var it = ind0.items[st.item], ex = st.extra ? ind0.extras[st.extra] : null, fee = ind0.fee;
  var base = it.price + (ex ? ex.price : 0);
  var tax = Math.round(base * ind0.tax * 100) / 100;
  st.total = Math.round((base + tax + o.fee + (fee ? fee.price : 0)) * 100) / 100;
  var rows = '<table class="q"><tr><td>' + esc(it[lang]) + "</td><td>" + money(it.price) + "</td></tr>" +
    (ex ? "<tr><td>" + esc(ex[lang]) + "</td><td>" + money(ex.price) + "</td></tr>" : "") +
    (fee ? "<tr><td>" + esc(fee[lang]) + "</td><td>" + money(fee.price) + "</td></tr>" : "") +
    (ind0.optRow ? "<tr><td>" + esc(t("delivery")) + " · " + esc(name) + "</td><td>" + (o.fee ? money(o.fee) : esc(t("free"))) + "</td></tr>" : "") +
    (ind0.tax ? '<tr class="sub"><td>' + esc(t("tax")) + "</td><td>" + money(tax) + "</td></tr>" : "") +
    '<tr class="total"><td>' + esc(t("total")) + "</td><td>" + money(st.total) + "</td></tr></table>";
  botTurn([esc(t("b_quote")) + rows, esc(t("b_quote2")(st.when))], function(){
    addLog("bolt", t("l_quote")(money(st.total).slice(1)), t("l_quoteS"));
    setReplies([{label:t("c_yes"), go:book}, {label:t("c_think"), go:think}]);
  });
}

function book(){
  say(t("c_yes"));
  botTurn([esc(t("b_name"))], function(){
    setReplies([{label:t("c_name"), go:function(){
      var ind0 = I(), o = ind0.opts[st.opt];
      st.name = t("c_name"); say(st.name);
      var pay = '<a class="paylink" href="#" onclick="return false"><svg width="22" height="22" aria-hidden="true"><use href="#i-cal"/></svg><span><b>' + esc(t("paylink")) + "</b>" + esc(t("paysub")) + "</span></a>";
      botTurn([esc(t("b_done")(st.name, st.when)) + pay, esc(t("b_done2"))], function(){
        addLog("bell", t("l_book"), t("l_bookS"));
        notify(t("n_title"), t("n_body")({
          name:st.name, when:st.when, item:ind0.items[st.item][lang], extra:st.extra ? ind0.extras[st.extra][lang] : "",
          say:o.say || "", opt:val(o[lang]), total:money(st.total).slice(1)
        }));
        finish();
      });
    }}]);
  });
}

function think(){
  say(t("c_think"));
  botTurn([esc(t("b_think"))], function(){
    addLog("clock", t("l_follow"), t("l_followS"));
    later(function(){
      sys(t("nextDay"));
      st.offset += 15 * 3600 * 1000;
      var d = now(); d.setHours(10, 0, 0, 0); st.offset = d.getTime() - st.base.getTime();
      bubble("in", esc(t("b_follow")(st.when)));
      addLog("clock", t("l_followSent"), t("l_followSentS"));
      setReplies([{label:t("c_yes"), go:book}, {label:t("c_no"), go:decline}]);
    }, 1400);
  });
}

function decline(){
  say(t("c_no"));
  botTurn([esc(t("b_bye"))], function(){
    addLog("x", t("l_lost"), t("l_lostS"));
    notify(t("n_lostT"), t("n_lostB"));
    finish();
  });
}

function notify(title, body){
  $("nTitle").textContent = title; $("nBody").textContent = body;
  var n = $("notify"); n.classList.remove("on"); void n.offsetWidth; n.classList.add("on");
  later(function(){ try { n.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "nearest"}); } catch (e) {} }, 900);
}
function finish(){
  later(function(){ $("cta").classList.add("on"); }, 700);
}

/* ---------- Idioma y negocio ---------- */
function paint(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){ var v = t(el.getAttribute("data-t")); if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll(".toggle button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"); });
  document.querySelectorAll(".picker button").forEach(function(b){
    b.textContent = IND[b.dataset.ind][lang].tab;
    b.setAttribute("aria-pressed", b.dataset.ind === ind ? "true" : "false");
  });
  $("bizName").textContent = I().name;
  $("bizAv").textContent = I().av;
  document.title = (lang === "es" ? "Demo QuoteLoop | " : "QuoteLoop Demo | ") + t("tname");
  start();
}
function applyLang(l){
  lang = l;
  try { localStorage.setItem("ql-lang", l); } catch (e) {}
  paint();
}
function applyInd(k){
  if (!IND[k]) return;
  ind = k;
  try { var u = new URL(location.href); u.searchParams.set("n", k); history.replaceState(null, "", u); } catch (e) {}
  paint();
}
document.querySelectorAll(".toggle button").forEach(function(b){ b.addEventListener("click", function(){ if (b.dataset.lang !== lang) applyLang(b.dataset.lang); }); });
document.querySelectorAll(".picker button").forEach(function(b){ b.addEventListener("click", function(){ if (b.dataset.ind !== ind) applyInd(b.dataset.ind); }); });
document.querySelectorAll("[data-restart]").forEach(function(b){ b.addEventListener("click", start); });

function tick(){ $("clock").textContent = new Date().toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit"}).replace(/\s?[AP]M$/, ""); }
tick(); setInterval(tick, 15000);

var params = new URLSearchParams(location.search);
var q = params.get("lang"), n = params.get("n");
if (q === "en" || q === "es") lang = q;
else {
  try { if (localStorage.getItem("ql-lang") === "en") lang = "en"; } catch (e) {}
}
if (n && IND[n]) ind = n;
paint();
})();
